[package]
name = "actixutils"
version = "0.5.1"
edition = "2024"
description = "Reusable middleware and request utilities for Actix Web"
license = "MIT"
repository = "https://github.com/Ferrumec/actixutils"
keywords = [
    "actix-web",
    "middleware",
    "api",
    "authentication",
    "authorization",
]
categories = [
    "web-programming",
    "web-programming::http-server",
    "authentication",
]

[dependencies]
actix-web = "4.12.1"
anyhow = "1.0.102"
async-trait = "0.1.89"
bytes = "1.11.1"
chrono = "0.4.44"
dashmap = "6.2.1"
futures-util = "0.3.32"
jsonwebtoken = { version = "9.3.1", optional = true }
rand = "0.10.1"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1", features = ["macros", "sync", "rt"] }
tracing = "0.1.44"
uuid = { version = "1.23.1", features = ["serde", "v4"] }
typed-eventbus = { version = "0.2.1", optional = true }
serde_json = { version = "1.0.150"}
thiserror = { version = "2.0.18"}
futures = "0.3.33"
moka = { version = "0.12.15", features = ["sync"] }

[features]
es = ["typed-eventbus"]
jwt = ["jsonwebtoken"]

